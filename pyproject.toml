[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spectral-shores"
version = "0.1.0"
description = "Spectral analysis system for automated shoreline detection from satellite and aerial imagery"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "CC0"}
authors = [
    {name = "Alisa Glenewinkel-Meyer"}
]
keywords = ["shoreline", "spectral-analysis", "remote-sensing", "geospatial", "PAIS"]

dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "rasterio>=1.2.0",
    "geopandas>=0.10.0",
    "shapely>=1.8.0",
    "pyproj>=3.2.0",
    "matplotlib>=3.4.0",
    "seaborn",
    "pyarrow>=10.0.0",
    "ruptures>=1.1.10",
    "hmmlearn>=0.3.3",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]
ml = [
    "scikit-learn>=1.0.0",
]

[project.scripts]
spectral-shores = "spectral_classifier.run:main"

[project.urls]
Repository = "https://github.com/GULN/GULN-spectral-shores"

[tool.setuptools.packages.find]
where = ["."]
include = ["spectral_classifier*"]